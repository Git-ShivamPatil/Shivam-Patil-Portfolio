name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run's result irrelevant.
# Cancelling it frees a runner and stops a stale red X from sitting on a commit
# that has already been superseded. Never cancels on main: those runs are the
# record of what was released.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Deliberately unreachable placeholders. `next build` prerenders pages and
  # runs generateStaticParams, both of which touch the database — and this job
  # asserts that a build SURVIVES having no database, degrading to on-demand
  # rendering instead of failing. That is the same resilience a Vercel deploy
  # needs when Neon has a blip mid-build.
  DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
  DIRECT_URL: "postgresql://user:pass@localhost:5432/db"
  AUTH_SECRET: "ci-placeholder-secret"
  AUTH_URL: "http://localhost:3000"
  # The `www` form, matching production. This used to be the bare apex, which
  # made CI the one environment that built the site against a host the
  # canonical tags, og:url and the OAuth redirect URIs all disagree with.
  NEXT_PUBLIC_SITE_URL: "https://www.shivamsfolio.com"

jobs:
  # Lint, typecheck, test and build. The gate every change passes.
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Installs pnpm directly rather than relying on `corepack enable`.
      #
      # Corepack's shims stopped landing on PATH on GitHub's runners, which
      # failed every run from #6 onward with "Unable to locate executable
      # file: pnpm" — 9 seconds in, before a single check had run. Nothing
      # about the project changed; the runner image did, which is exactly why
      # a toolchain this load-bearing should not depend on a Node feature
      # being enabled by default.
      #
      # No `version:` here on purpose — the action reads `packageManager` from
      # package.json, so the pinned pnpm version has one source of truth
      # instead of two that can silently drift apart.
      - uses: pnpm/action-setup@v4

      # Must come AFTER pnpm is installed: `cache: pnpm` shells out to
      # `pnpm store path`, which fails if the binary does not exist yet.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # P22. Placed before the build rather than after: both are fast, and a
      # high-severity finding should fail the run without first spending two
      # minutes producing an artifact that must not ship anyway.
      #
      # `security:sast` exits non-zero only on `high`. Medium and low are
      # printed and do not block — a scanner that fails a merge over a
      # low-severity nit is a scanner that gets muted within the week, and the
      # highs go with it.
      - name: Static analysis
        run: pnpm security:sast

      # Fails when a dependency moved without public/sbom.json being
      # regenerated. An SBOM that silently drifts out of date is worse than
      # none, because during an incident it will be trusted.
      #
      # Needs the full install above, not --prod: the check regenerates from
      # the installed tree and compares byte-for-byte against the committed
      # file, so a partial store would report a false staleness.
      - name: SBOM is current
        run: pnpm security:sbom:check

      - name: Build
        run: pnpm build

      # This job deliberately publishes no artifact.
      #
      # It used to hand `.next` to the E2E job, on the reasoning that two builds
      # are two chances to test something other than what was verified. That was
      # sound, and it was still wrong here: `/` is a **static** route, so the
      # project list the navigation specs click through is baked into HTML at
      # build time — and this job builds against a deliberately unreachable
      # database. The artifact it produced therefore had an empty homepage and
      # no project pages at all, which is correct output for this job's purpose
      # and useless as the subject of an end-to-end test.
      #
      # The two jobs genuinely need different builds: this one proves a build
      # survives having no database, and E2E needs a build that has content.

  # P15. Real browsers, clicking real links.
  #
  # This exists because of a specific bug: every client-side navigation on this
  # site rendered a blank page for days while every route returned 200 with
  # complete HTML. `fetch()` sweeps could not see it and unit tests could not
  # see it. Only clicking could.
  e2e:
    name: E2E and accessibility
    runs-on: ubuntu-latest
    needs: build

    # Serialised across runs, because this job pushes a schema, seeds it and
    # rebuilds the retrieval index on one shared Neon branch. Two runs doing
    # that concurrently would interleave a full index rebuild with another
    # run's queries. `cancel-in-progress: false` — a half-seeded database is
    # worse than a queued job.
    concurrency:
      group: ci-database
      cancel-in-progress: false

    env:
      # Overrides the deliberately-unreachable placeholders at the top of this
      # file, for this job only. The build job must keep them: proving that
      # `next build` survives an unreachable database is what protects a Vercel
      # deploy when Neon blips mid-build, and that property is asserted by the
      # build job continuing to pass without one.
      #
      # One URL serves both variables because it is the *unpooled* endpoint.
      # `prisma db push` runs session-level statements that PgBouncer in
      # transaction mode cannot, and the Neon driver adapter connects happily
      # to either endpoint.
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.E2E_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # Without this the failure is a silent 120-second Playwright timeout
      # waiting on a webServer whose /api/health returns 503, which names
      # nothing and is exactly how this job failed unnoticed for eight runs.
      - name: Fail early if the CI database is not configured
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::secrets.E2E_DATABASE_URL is not set. The E2E suite needs a reachable database; see HANDOFF 'CI needs a database'."
            exit 1
          fi
          # Never printed, only tested for. `prisma db push` takes advisory
          # locks and runs session-level statements, which PgBouncer in
          # transaction mode cannot carry — so a pooled URL fails at "Push
          # schema" with an error that says nothing about pooling. Naming it
          # here costs one string comparison and saves a whole debugging cycle.
          case "${DATABASE_URL}" in
            *-pooler.*)
              echo "::error::E2E_DATABASE_URL is the POOLED endpoint (its host contains '-pooler'). Prisma's schema push needs the direct one — copy the connection string again with connection pooling turned OFF."
              exit 1
              ;;
          esac

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Must come BEFORE `db push`, and the schema comment on KnowledgeChunk is
      # what says why: `embedding` is `Unsupported("vector(256)")`, so the table
      # cannot be created at all until the extension providing that type exists.
      #
      # `pnpm ai:index` also creates it, which is enough on a database that has
      # already been through this once — and is why the ordering held on
      # production and failed the first time CI pointed at a fresh branch. The
      # indexer cannot simply run earlier: it writes to the very tables `db
      # push` is about to create.
      #
      # `prisma db execute` rather than psql, so this depends on the toolchain
      # the repo already installs rather than on what the runner image ships.
      # It takes no `--url` in Prisma 7 — the datasource comes from
      # prisma.config.ts, which reads DIRECT_URL, which this job sets above.
      - name: Enable pgvector
        run: echo 'CREATE EXTENSION IF NOT EXISTS vector;' | pnpm exec prisma db execute --stdin

      # `db push` rather than `migrate deploy`: this project has never used a
      # migration history, and the CI branch is disposable.
      #
      # No `--skip-generate` — Prisma 7 removed that flag, and passing it fails
      # the command outright before it ever reaches the database. The client is
      # generated by `postinstall` two steps above regardless.
      - name: Push schema
        run: pnpm exec prisma db push

      - name: Seed content
        run: |
          pnpm db:seed
          pnpm db:seed:services

      # Also creates the pgvector extension and the HNSW index, so a fresh
      # branch needs no manual preparation before the P16 specs run.
      - name: Build the retrieval index
        run: pnpm ai:index

      # Built here, with a database, rather than reusing the build job's
      # artifact — see the note in that job for why its output cannot serve as
      # the subject of an end-to-end test.
      - name: Build
        run: pnpm build

      # Chromium only. The bugs this suite is built to catch are navigation and
      # rendering bugs, not engine differences, and three browsers would triple
      # the runtime to re-answer a question the first one already answered.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E
        run: pnpm test:e2e

      - name: Upload report
        # `always()`: the report is at its most useful precisely when the step
        # before it failed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # P15. The performance budget, asserted rather than admired.
  #
  # HANDOFF recorded an honest gap: the font work was structurally verified —
  # zero external origins is not a matter of measurement — but its effect on LCP
  # was never independently confirmed, because PageSpeed Insights rate-limited
  # every attempt from that network. This closes it by measuring on every run
  # instead of asking once.
  #
  # Not a required check: Lighthouse's variance on a shared runner is several
  # points even across three runs, and a build that fails on noise is a build
  # people learn to re-run without reading. It reports; a human decides.
  lighthouse:
    name: Lighthouse budget
    runs-on: ubuntu-latest
    # After E2E rather than after build, for two reasons: it needs the same
    # content-bearing build (a homepage with no projects is not the page whose
    # LCP is being budgeted), and running it alongside E2E would have both jobs
    # on the one CI database at once.
    needs: e2e
    continue-on-error: true

    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.E2E_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No seeding here — the E2E job this one depends on has already pushed
      # the schema and seeded the branch. This job only reads.
      - name: Build
        run: pnpm build

      - name: Run Lighthouse CI
        run: pnpm test:lighthouse
