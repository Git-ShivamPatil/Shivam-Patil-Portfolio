name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Deliberately unreachable placeholders. `next build` prerenders pages
      # and runs generateStaticParams, both of which touch the database — and
      # this job asserts that a build SURVIVES having no database, degrading to
      # on-demand rendering instead of failing. That is the same resilience a
      # Vercel deploy needs when Neon has a blip mid-build.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
      DIRECT_URL: "postgresql://user:pass@localhost:5432/db"
      AUTH_SECRET: "ci-placeholder-secret"
      AUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_SITE_URL: "https://shivamsfolio.com"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
