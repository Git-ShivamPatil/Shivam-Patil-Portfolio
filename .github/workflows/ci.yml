name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Deliberately unreachable placeholders. `next build` prerenders pages
      # and runs generateStaticParams, both of which touch the database — and
      # this job asserts that a build SURVIVES having no database, degrading to
      # on-demand rendering instead of failing. That is the same resilience a
      # Vercel deploy needs when Neon has a blip mid-build.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
      DIRECT_URL: "postgresql://user:pass@localhost:5432/db"
      AUTH_SECRET: "ci-placeholder-secret"
      AUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_SITE_URL: "https://shivamsfolio.com"
    steps:
      - uses: actions/checkout@v5

      # Installs pnpm directly rather than relying on `corepack enable`.
      #
      # Corepack's shims stopped landing on PATH on GitHub's runners, which
      # failed every run from #6 onward with "Unable to locate executable
      # file: pnpm" — 9 seconds in, before a single check had run. Nothing
      # about the project changed; the runner image did, which is exactly why
      # a toolchain this load-bearing should not depend on a Node feature
      # being enabled by default.
      #
      # No `version:` here on purpose — the action reads `packageManager` from
      # package.json, so the pinned pnpm version has one source of truth
      # instead of two that can silently drift apart.
      - uses: pnpm/action-setup@v4

      # Must come AFTER pnpm is installed: `cache: pnpm` shells out to
      # `pnpm store path`, which fails if the binary does not exist yet.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
